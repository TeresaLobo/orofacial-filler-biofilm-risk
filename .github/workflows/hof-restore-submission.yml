name: Restore verified HOF submission artifacts
on:
  push:
    branches: [main]
    paths:
      - 'submissions/clinical-oral-investigations/2026-10-07/**/*.b64'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Restore and verify submission files
        run: python3 submissions/clinical-oral-investigations/2026-10-07/restore_binary_files.py --cleanup
      - name: Commit verified native files and remove one-time workflow
        run: |
          rm .github/workflows/hof-restore-submission.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submissions/clinical-oral-investigations/2026-10-07 .github/workflows/hof-restore-submission.yml
          git commit -m 'Restore checksummed native HOF submission files'
          git push origin HEAD:main
